services:
  db:
    image: pgvector/pgvector:pg16
    container_name: filmcortex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-filmcortex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filmcortex}
      POSTGRES_DB: ${POSTGRES_DB:-filmcortex}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-filmcortex} -d ${POSTGRES_DB:-filmcortex}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: filmcortex-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-filmcortex}:${POSTGRES_PASSWORD:-filmcortex}@db:5432/${POSTGRES_DB:-filmcortex}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src:ro
    command: ["uvicorn", "filmcortex.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
